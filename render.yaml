services:
  - type: web
    name: ucam-stereo-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: npm run start:render --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ucam-stereo-db
          property: connectionString
      - key: PGSSL
        value: "false"
      - key: AUTO_INIT_DB
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: N8N_ORDER_WEBHOOK_URL
        sync: false
      - key: N8N_ORDER_WEBHOOK_SECRET
        sync: false
      - key: N8N_ORDER_WEBHOOK_TIMEOUT_MS
        value: "5000"
      - key: N8N_ORDER_WEBHOOK_POLL_INTERVAL_MS
        value: "10000"
      - key: N8N_ORDER_WEBHOOK_MAX_ATTEMPTS
        value: "8"
      - key: N8N_INCIDENT_AGENT_WEBHOOK_URL
        sync: false
      - key: N8N_INCIDENT_AGENT_WEBHOOK_HEADER
        sync: false
      - key: N8N_INCIDENT_AGENT_WEBHOOK_SECRET
        sync: false
      - key: N8N_INCIDENT_AGENT_TIMEOUT_MS
        value: "60000"
      - key: BO_ADMIN_EMAIL
        sync: false
      - key: BO_ADMIN_PASSWORD
        sync: false
      - key: TRACKING_LINK_SECRET
        generateValue: true

databases:
  - name: ucam-stereo-db
    databaseName: ucam_stereo
    user: ucam_stereo
    region: frankfurt
    plan: free
